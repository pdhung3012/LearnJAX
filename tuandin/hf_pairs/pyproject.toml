[project]
name = "hf-pairs"
version = "0.1.0"
description = "Tier 2 dataset: PyTorch↔Flax translation eval cases mined from HuggingFace transformers (last Flax-supporting release: 4.46.3)."
requires-python = ">=3.10,<3.11"

dependencies = [
    # transformers 5.x removed Flax support; 4.46.3 is the last release with
    # FlaxBertModel etc. and the from_pt=True weight-conversion path.
    "transformers==4.46.3",
    "torch==2.5.1",
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "flax==0.10.7",
    "optax==0.2.2",
    "numpy<2",
    "huggingface_hub",
    "safetensors",
    "tokenizers",
    "sentencepiece",
]

[project.optional-dependencies]
# Pulled in via `uv sync --extra vision` for ViT-style cases.
vision = [
    "pillow",
    "torchvision==0.20.1",
]
# Reserved for future audio cases (Wav2Vec2/Whisper) — not needed yet.
audio = [
    "librosa",
    "soundfile",
]

[tool.uv]
managed = true
